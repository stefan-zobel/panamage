# Builds the libjxl shared libraries for macOS arm64 from source (libjxl
# publishes no macOS binaries). The archive is a workflow artifact; its content
# is checked in under natives/ (see natives/README.md).
name: libjxl for macOS arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build and check libjxl
        run: python scripts/build_libjxl_macos.py --output dist/natives

      - uses: actions/upload-artifact@v7
        with:
          name: libjxl-macos-aarch64
          path: dist/natives/
