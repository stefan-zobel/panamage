# Builds the libjxl shared libraries for Linux aarch64 from source (libjxl
# publishes no binaries for 64-bit ARM). The build runs in the manylinux_2_28
# container, so the libraries need glibc 2.28 or newer. The archive is a
# workflow artifact; its content is checked in under natives/ (see
# natives/README.md).
name: libjxl for Linux aarch64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # manylinux_2_28_aarch64 2026.09.30-1 (AlmaLinux 8, glibc 2.28)
  IMAGE: quay.io/pypa/manylinux_2_28_aarch64@sha256:acc4e63610fef1da3d687322793665205415c2b22c0d2e403f1a44eb834d63fc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build and check libjxl
        run: >
          docker run --rm --volume "$PWD:/work" --workdir /work "$IMAGE"
          /opt/python/cp313-cp313/bin/python scripts/build_libjxl_linux_aarch64.py --output dist/natives

      - uses: actions/upload-artifact@v7
        with:
          name: libjxl-linux-aarch64
          path: dist/natives/
