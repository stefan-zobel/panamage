# Builds panamage and runs all tests on the platforms whose native libraries it
# bundles, on real hardware. Started manually; the platforms can be chosen.
name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test on
        type: choice
        options:
          - all
          - linux
          - linux-aarch64
          - linux-musl
          - linux-musl-aarch64
          - macos
          - windows
        default: all

permissions:
  contents: read

env:
  # eclipse-temurin 25.0.4.1_1 JDK on Alpine 3.21 (musl), multi-platform image index
  ALPINE_JDK_IMAGE: eclipse-temurin:25.0.4.1_1-jdk-alpine-3.21@sha256:85d59a742f07999afc622094e494ba3c91a58af19c09c1f8d2cc5854a1d24c7a

jobs:
  # A job-level condition cannot use the matrix, so the matrix is computed here.
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      hosted: ${{ steps.select.outputs.hosted }}
      musl_matrix: ${{ steps.select.outputs.musl_matrix }}
      musl: ${{ steps.select.outputs.musl }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: select
        shell: python
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          import json, os
          runners = {"linux": "ubuntu-24.04", "linux-aarch64": "ubuntu-24.04-arm",
                     "macos": "macos-15", "windows": "windows-2025"}
          musl_runners = {"linux-musl": "ubuntu-24.04", "linux-musl-aarch64": "ubuntu-24.04-arm"}
          chosen = os.environ["PLATFORMS"]
          include = [{"name": name, "os": os_} for name, os_ in runners.items() if chosen in ("all", name)]
          musl = [{"name": name, "os": os_} for name, os_ in musl_runners.items() if chosen in ("all", name)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps({"include": include}) + "\n")
              out.write("musl_matrix=" + json.dumps({"include": musl}) + "\n")
              # An empty matrix is an error, so the jobs are skipped instead.
              out.write("hosted=" + json.dumps(bool(include)) + "\n")
              out.write("musl=" + json.dumps(bool(musl)) + "\n")

  build:
    needs: select
    if: needs.select.outputs.hosted == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # JDK 21 for panamage-jxl-jdk21; set up first, so that JAVA_HOME is the JDK 25.
      - uses: actions/setup-java@v6
        id: jdk21
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch_tools.py') }}

      - name: Download native libraries and test data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_tools.py --build-only

      - name: Register the JDKs as Maven toolchains
        run: python scripts/write_toolchains.py --jdk "${{ env.JAVA_HOME }}" --jdk21 "${{ steps.jdk21.outputs.path }}"

      - name: Build and test
        if: runner.os != 'Windows'
        run: ./mvnw -B -Pjdk21 verify

      - name: Build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B -Pjdk21 verify

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.name }}
          path: "*/target/surefire-reports/"
          if-no-files-found: ignore

  # Linux with musl (Alpine): the tests run in a container with a JDK for
  # Alpine, so the JVM itself uses musl and loads the musl libraries. A
  # container job cannot run the actions in Alpine, so the build runs in
  # docker run; the downloads are made on the runner. The container has only
  # a JDK 25, so panamage-jxl-jdk21 (profile jdk21) is not built here.
  linux-musl:
    needs: select
    if: needs.select.outputs.musl == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.musl_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch_tools.py') }}

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ matrix.name }}-

      - name: Download native libraries and test data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_tools.py --build-only

      - name: Build and test on Alpine
        run: >
          docker run --rm --volume "$PWD:/work" --volume "$HOME/.m2:/root/.m2" --workdir /work
          "$ALPINE_JDK_IMAGE" sh -c
          'apk add --no-cache python3
          && java -version
          && python3 scripts/write_toolchains.py --jdk "$JAVA_HOME"
          && ./mvnw -B verify'

      # The container writes as root; the cache step must be able to read the repository.
      - name: Hand the Maven repository to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.m2 . || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.name }}
          path: "*/target/surefire-reports/"
          if-no-files-found: ignore
